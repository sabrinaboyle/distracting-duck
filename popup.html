<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Distraction Duck</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Distraction Duck</h1>
      <p id="loading" role="status">Loading session…</p>

      <section id="setup-view" hidden>
        <p id="intro">Name the task you want to work on, and one website that distracts you.</p>

        <form id="session-form">
          <p id="form-error" role="alert" tabindex="-1" hidden></p>

          <div class="field">
            <label for="task">Task</label>
            <input
              id="task"
              name="task"
              type="text"
              autocomplete="off"
              maxlength="160"
            >
          </div>

          <div class="field">
            <label for="distraction">Distracting website</label>
            <input
              id="distraction"
              name="distraction"
              type="url"
              autocomplete="off"
              spellcheck="false"
              maxlength="200"
              placeholder="https://example.com"
              aria-describedby="distraction-hint"
            >
            <p id="distraction-hint" class="hint">Use a full address, such as https://example.com.</p>
          </div>

          <button id="start-button" type="submit">Start focus session</button>
        </form>
      </section>

      <section id="active-view" hidden>
        <h2 id="session-status" tabindex="-1">Focus session is active</h2>
        <dl>
          <div>
            <dt>Task</dt>
            <dd id="active-task"></dd>
          </div>
          <div>
            <dt>Distracting website</dt>
            <dd id="active-site"></dd>
          </div>
          <div>
            <dt>Work tab</dt>
            <dd id="active-work-tab"></dd>
          </div>
        </dl>
        <button id="stop-button" type="button">Stop focus session</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
